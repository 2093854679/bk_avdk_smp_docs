<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420">
  <rect x="0" y="0" width="900" height="420" fill="#2b76c4"/>
  <rect x="6" y="6" width="888" height="332" fill="#e9e9e9"/>
  <rect x="6" y="6" width="888" height="16" fill="#26b6c8"/>
  <rect x="31" y="34" width="170" height="17" fill="#2476d8"/>

  <text x="8" y="18" fill="#ffffff" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="14">(Top) / Board &amp; SoC</text>
  <text x="314" y="18" fill="#000000" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="14">Armino SDK bk7259_ap Configuration</text>

  <g font-family="DejaVu Sans Mono, Consolas, monospace" font-size="14">
    <text x="34" y="48" fill="#ffffff" font-weight="700">SoC Configuration  ---&gt;</text>
    <text x="34" y="67" fill="#000000">Architecture       ---&gt;</text>
  </g>

  <g font-family="DejaVu Sans Mono, Consolas, monospace" font-size="13">
    <rect x="280" y="44" width="560" height="110" rx="6" fill="#f7f7f7" stroke="#999999"/>
    <text x="300" y="70" fill="#000000">SoC Configuration</text>
    <text x="320" y="94" fill="#000000">SoC, CPU count, SMP core count, CPU ID offset,</text>
    <text x="320" y="118" fill="#000000">TCM size, TrustZone, SoC workaround, UART pins.</text>

    <rect x="280" y="178" width="560" height="88" rx="6" fill="#f7f7f7" stroke="#999999"/>
    <text x="300" y="204" fill="#000000">Architecture</text>
    <text x="320" y="228" fill="#000000">Core, Cortex-M, MPU, CMSIS, board capability.</text>
  </g>

  <rect x="6" y="339" width="888" height="75" fill="#2b76c4"/>
  <g fill="#ffffff" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="14">
    <text x="7" y="358">[Space/Enter] Toggle/enter   [ESC] Leave menu        [S] Save</text>
    <text x="7" y="378">[O] Load                     [?] Symbol info        [/] Jump to symbol</text>
    <text x="7" y="398">[F] Toggle show-help mode    [C] Toggle show-name   [A] Toggle show-all mode</text>
    <text x="7" y="418">[Q] Quit (prompts for save)  [D] Save Project minimal default config</text>
  </g>
</svg>
